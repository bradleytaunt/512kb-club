image: alpine/edge
packages:
  - yq
  - git
  - openssh
secrets:
  - 877617a4-009f-43a7-9b4c-25e921d2f61f
sources:
  - https://git.sr.ht/~bt/512kb-club
submitter:
  git.sr.ht:
    enabled: true
    allow-refs:
      - refs/heads/master
tasks:
  - format-sites: |
      cd 512kb-club
      git checkout master
      git log -1 --pretty=format:'%an' | grep -q "Formatting Bot" && exit 0
      git config user.email "bot@512kb.club"
      git config user.name "Formatting Bot"
      git remote set-url origin git@git.sr.ht:~bt/512kb-club
      ssh-keyscan git.sr.ht >> ~/.ssh/known_hosts
      yq --inplace 'sort_by(.domain)' _data/sites.yml
      sed -i '1!s/- domain:/\n- domain:/g' _data/sites.yml
      git diff --quiet || git commit -am "Fix formatting" && git push origin master
