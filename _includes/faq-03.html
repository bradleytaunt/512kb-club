<details name="faq" name="faq">
    <summary>I've made changes to my site and it's a different size now. What do I do?</summary>
    <p>We <i>try</i> to regularly check all the sites that are added to the <b>The 512KB Club</b>. But if you have made changes and the size of your site needs updating please <a href="https://lists.sr.ht/~bt/512kb-club-devel">open a new patch</a> with your changes.</p>
</details>
